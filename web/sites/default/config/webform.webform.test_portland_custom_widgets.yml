id: test_portland_custom_widgets
title: 'Test Portland Custom Widgets'
description: "<p>This is a draft demo form to showcase the custom elements we've created for use on Portland.gov.</p>"
categories:
  - Test
elements: |-
  section_portland_location_picker:
    '#type': webform_section
    '#title': 'Portland Location Picker'
    portland_location_picker:
      '#type': portland_location_picker
      '#title': 'Portland Location Picker'
      '#description': '<p>Collects location data either spatially or by address. Can load GeoJSON layers representing regions, assets, and open tickets. Can call external APIs and display data about a location. Uses PortlandMaps.com data.</p>'
      '#require_city_limits': true
  horizontal_rule:
    '#type': webform_horizontal_rule
  section_portland_address_verifier:
    '#type': webform_section
    '#title': 'Portland Address Verifier'
    portland_address_verifier:
      '#type': portland_address_verifier
      '#title': 'Portland Address Verifier'
      '#description': '<p>Used for collecting street addresses. Can verify and validate addresses in the Portland metro area. Can call any number of APIs to retrieve property, permit, environmental, and other data from PortlandMaps.</p>'
      '#secondary_queries':
        - api: 'https://www.portlandmaps.com/api/detail/'
          api_args:
            - detail_type: zoning
            - sections: zoning
            - geometry: '{"x":${x}, "y":${y}}'
            - api_key: AC3208DDEFB2FD0AE5F26D573C27252F
          capture:
            - path: 'zoning.overlay[].code'
              field: zoning_overlays
              parse: stringify
            - path: 'zoning.base[0].code'
              field: base_zone
              parse: stringify
            - path: 'zoning.historic_district[].code'
              field: historic_district
              parse: stringify
            - path: 'zoning.national_register_district[].code'
              field: national_register_district
              parse: stringify
            - path: 'zoning.conservation_district[].code'
              field: conservation_district
              parse: stringify
            - path: historic_resource
              field: historic_resource
              parse: flatten
              omit_null_properties: true
        - api: 'https://www.portlandmaps.com/api/detail/'
          api_args:
            - detail_type: environmental-percent-slope
            - sections: general
            - geometry: '{"x":${x}, "y":${y}}'
            - api_key: AC3208DDEFB2FD0AE5F26D573C27252F
          capture:
            - path: general.percent_slope
              field: site_slope
    site_slope:
      '#type': textfield
      '#title': 'Site slope'
    zoning_overlays:
      '#type': textfield
      '#title': 'Zoning overlays'
    base_zone:
      '#type': textfield
      '#title': 'Base zone'
    historic_district:
      '#type': textfield
      '#title': 'Historic district'
    national_register_district:
      '#type': textfield
      '#title': 'National register district'
    conservation_district:
      '#type': textfield
      '#title': 'Conservation district'
    historic_resource:
      '#type': textfield
      '#title': 'Historic resource'
  horizontal_rule_01:
    '#type': webform_horizontal_rule
  section_portland_alert:
    '#type': webform_section
    '#title': 'Portland Alert'
    alert_portland_alert:
      '#type': portland_alert
      '#alert_markup': '<h3>Information</h3><p>The Portland Alert element is used to display informational and warning messages in a consistent and accessible way that uses brand styles and supports screen readers.</p>'
    alert_portland_alert_warning:
      '#type': portland_alert
      '#alert_variation': warning
      '#alert_markup': '<h3>Warning</h3><p>This is what a warning alert looks like. They can be configured to display conditionally based on form input or data being returned by the Location Picker or Address Verifier widgets.</p>'
  horizontal_rule_02:
    '#type': webform_horizontal_rule
