description: "<ul>\r\n<li>The first image is shown on the left and the second one on the right. Drag them to change the order.</li>\r\n<li>Image resolution should be at least <strong>1600 by 800 pixels</strong> for best results.</li>\r\n<li>Photography should be uploaded as a JPEG file.</li>\r\n<li>Make sure to provide alt text that contains a concise, objective description of the content portrayed in the image. Alt text is never displayed to sighted users because it should contain the same information the user can get by viewing the image.</li>\r\n</ul>"
