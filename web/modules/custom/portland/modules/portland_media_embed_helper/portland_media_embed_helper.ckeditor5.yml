# Prevents linking an embedded Image Slider.
portland_media_embed_helper_image_slider_no_link:
  ckeditor5:
    plugins:
      - portlandImageSlider.ImageSliderNoLink
  drupal:
    label: Image Slider - no links
    library: portland_media_embed_helper/ckeditor5.image_slider_no_link
    elements: false
    conditions:
      toolbarItem: insert_image_slider
