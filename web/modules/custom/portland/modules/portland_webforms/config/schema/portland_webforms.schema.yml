webform.settings.third_party.portland:
  type: mapping
  label: 'Portland webform third party settings'
  mapping:
    settings:
      type: mapping
      label: 'Portland'
      mapping:
        disable_demographic_form_prompt:
          type: boolean
          label: 'Disable demographic form prompt'
        disable_public_records_statement:
          type: boolean
          label: 'Disable public records statement'
        exclude_from_json:
          type: sequence
          label: 'Exclude from JSON'
          orderby: value
          sequence:
            type: string
            label: 'Element'
